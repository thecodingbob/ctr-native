[General]
; Set to true to skip all boot intros
; (SCEA Presents, Copyright, Naughty Dog)
skip_intro = false
; Set to true to show the in-game reserves meter
show_reserves_meter = false
; Set to true to allow selecting Oxide Station in multiplayer
allow_oxide_station_multiplayer = false
; Mask assignment mode: Normal, Random, Inverted, All Uka, All Aku
mask_mode = Normal

[Adventure]
; Set to true to skip mask hints in adventure mode
skip_hints = false
; Set to true to be able to select all unlocked characters for adventure mode
extended_character_select = false
; Set to true to enable saving anywhere in Adventure mode by pressing select
save_anywhere = false
; Set to true to open all adventure mode wood gates without keys
unlock_all_gates = false
; Set to true to unlock all warp pads and boss garages in adventure mode
unlock_all_portals = false

[Vehicle]
; Speed stat multiplier in percent (100 = default, in-game range 10-200)
speed_stat_multiplier = 100
; Gravity stat multiplier in percent (100 = default, in-game range 10-300)
gravity_stat_multiplier = 100
; Turn stat multiplier in percent (100 = default, in-game range 10-400)
turn_stat_multiplier = 100
; Jump stat multiplier in percent (100 = default, in-game range 10-300)
jump_stat_multiplier = 100
; Reserve accumulation multiplier (100 = default, in-game range 0-400)
turbo_reserves_multiplier = 100

[Weapons]
; Missile traveling speed multiplier in percent (100 = default, in-game range 20-500)
missile_speed_multiplier = 100;
; Bomb traveling speed multiplier in percent (100 = default, in-game range 20-300)
bomb_speed_multiplier = 100;
; Warpball traveling speed multiplier in percent (100 = default, in-game range 20-300)
warpball_speed_multiplier = 100;
; Bomb explosion radius multiplier in percent (100 = default, in-game range 50-600)
bomb_explosion_radius = 100;
; TNT/Nitro crate explosion radius multiplier in percent (100 = default, in-game range 50-600)
tnt_explosion_radius = 100;
; Set to false to allow taking damage while a mask is active (default: true)
mask_protects_from_damage = true
; Set to false to prevent mask from damaging other drivers on contact (default: true)
mask_damages_others = true
; Set to true to keep the mask active after falling out of bounds (default: false)
mask_persists_after_oob = false
; Mask duration multiplier in percent (100 = default, in-game range 20-250)
mask_duration_multiplier = 100
; Mask extra speed multiplier in percent (100 = default, in-game range 0-300)
mask_extra_speed_multiplier = 100
; Clock duration multiplier in percent (100 = default, in-game range 20-250)
clock_duration_multiplier = 100
; Set to true to allow using weapons while affected by a clock (default: false)
allow_weapons_during_clock = false

[Graphics]
; Set to true to increase viewing distance (3x default)
increase_draw_distance = false
; Set to true to use full-detail tracks, models, and effects in split screen
disable_split_screen_lod = false
; Set to true to enable PSX dithering effect
dithering = true
; Set to true to start in borderless fullscreen
fullscreen = false
; Aspect ratio: 4:3, 16:9, 16:10, 21:9
aspect_ratio = 16:9
; Internal render resolution: Original, 2X, 3X, 4X, Native
render_scale = Native
; Set to true to smooth the direct-present image at scaled resolutions
smooth_scaling = true
; Set to true to enable bilinear PSX texture filtering
texture_filtering = false
